<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Akash Samanta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <style>
        body {
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .code {
            font-family: var(--font-mono);
            color: var(--accent);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
        }

        h1 {
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            margin-top: 0.75rem;
        }

        p {
            color: var(--text-secondary);
            margin-top: 0.75rem;
        }

        a {
            display: inline-flex;
            margin-top: 1.75rem;
            padding: 0.85rem 1.4rem;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: #06090d;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div>
        <div class="code">404 — NOT FOUND</div>
        <h1>This route doesn't exist.</h1>
        <p>The page you're looking for was moved, renamed, or never built.</p>
        <a href="/">Back to the homepage</a>
    </div>
</body>

</html>
